services:
  db:
    image: postgres:16-alpine
    container_name: youtube-ad-impressions-db
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ad_impressions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ad_impressions}
      POSTGRES_DB: ${POSTGRES_DB:-ad_impressions}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ad_impressions} -d ${POSTGRES_DB:-ad_impressions}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
