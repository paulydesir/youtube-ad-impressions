[project]
name = "youtube-ad-transcription-worker"
version = "0.1.0"
description = "Async local Whisper transcription worker for YouTube ads."
requires-python = ">=3.12"
dependencies = [
  "faster-whisper==1.2.1",
  "yt-dlp==2026.8.19",
  "psycopg[binary]==3.2.9",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
